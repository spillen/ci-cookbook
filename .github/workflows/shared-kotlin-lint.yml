name: Kotlin Lint

on:
  workflow_call:
    inputs:
      java-version:
        description: Java version
        required: false
        type: string
        default: '21'
      gradle-task:
        description: Gradle lint task to run (for example ktlintCheck)
        required: true
        type: string

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: spillen/ci-cookbook/actions/setup-java@master
        with:
          java-version: ${{ inputs.java-version }}

      - name: Run Gradle lint
        env:
          GRADLE_TASK: ${{ inputs.gradle-task }}
        run: ./gradlew "$GRADLE_TASK"
