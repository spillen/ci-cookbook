name: Go Test

on:
  workflow_call:
    inputs:
      go-version-file:
        description: File with the Go version (go.mod, go.work or .go-version)
        required: false
        type: string
        default: go.mod

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: spillen/ci-cookbook/actions/setup-go@master
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - name: Run go test
        run: go test -race ./...
